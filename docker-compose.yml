version: '3.8'

services:
  knowledge-graph-entity-linker:
    build: .
    container_name: knowledge-graph-entity-linker
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=knowledge-graph-entity-linker-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
