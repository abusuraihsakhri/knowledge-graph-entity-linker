[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph-entity-linker"
version = "2.0.1"
description = "Deterministic telemetry evaluation and audit tooling"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Dr. Abu Suraih Sakhri"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
knowledge-graph-entity-linker = "graph_linker.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/knowledge-graph-entity-linker"
Repository = "https://github.com/abusuraihsakhri/knowledge-graph-entity-linker.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "graph_linker_app"]

[tool.setuptools.packages.find]
include = ["agents*", "graph_linker*"]
