name: Test and security checks

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[server,test]"
      - name: Compile Python modules
        run: python -m compileall -q agents graph_linker cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify browser script syntax
        run: |
          node --check web/app.js
          node --check web/core.js
          node --test web/core.test.cjs
